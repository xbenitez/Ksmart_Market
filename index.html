<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Consola del Broker para el Smart Market Challenge de Kruger School.">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<title>KrugerSchool Smart Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Kruger School trading board. Night-blue ground for the projector, flat rounded panels, orange for the one main action, cyan for key data; each asset keeps one color everywhere. Single dark theme by design. */
:root{
  --bg:#0A1430; --dot:#0A1430; --surface:#111D40; --sunk:#0D1836; --line:#26365F;
  --ink:#F3F6FF; --muted:#9AA8C9; --shadow:transparent; --accent:#FF5B00; --accent-ink:#0A1430; --accent-soft:#3A1E0C;
  --pop:#FF5B00; --cyan:#00B2E3;
  --up:#2BD47D; --down:#FF8A7A; --up-soft:#123A2A; --down-soft:#46181C; --warn:#FFD23F; --warn-soft:#3E2E10;
  --a1:#0099C4; --a2:#22A85F; --a3:#9877F5; --a4:#C97000; --a5:#EC4C8F; --cash:#4A5B88;
  --c-rent:#00B2E3; --c-div:#2BD47D; --c-risk:#FFD23F; --c-dec:#B9A6FF;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:24px; --bw:2px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid var(--ink);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.pop{background:var(--pop);color:#121429}
button.ghost{box-shadow:none;border-color:var(--line);background:transparent}
button.ghost:hover{border-color:var(--ink);transform:none}
button.danger{background:var(--down);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
input,select{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
input:focus,select:focus{border-color:var(--ink)}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

.card{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none;border-color:var(--line)}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.card-h p{margin:0;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:18px}
.cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}

/* control strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 0;border-bottom:var(--bw) solid var(--ink)}
.strip-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.logo{display:flex;align-items:center;gap:12px}
.ks-logo{height:34px;width:auto;flex:none;display:block}
.logo-name .ver{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--muted);opacity:.8}
.verbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--warn);color:#0A1430;border-radius:16px;padding:12px 18px;margin-bottom:14px;font-weight:800}
.presence{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.presence .pc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--sunk);border:2px solid var(--line);font-size:12px;color:var(--muted)}
.presence .pc b{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
.presence .dot{width:10px;height:10px;border-radius:50%;flex:none}
.presence .on{border-color:var(--up)}.presence .on .dot{background:var(--up)}
.presence .mid{border-color:var(--warn)}.presence .mid .dot{background:var(--warn)}
.presence .off .dot{background:var(--down)}
.logo-name{border-left:var(--bw) solid var(--line);padding-left:12px}
.logo-name b{font-family:var(--f-display);font-size:17px;font-weight:800;line-height:1;display:block}
.logo-name span{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.round-ctl{display:flex;align-items:center;gap:6px}
.round-ctl button{padding:6px 10px}
.round-badge{font-family:var(--f-display);font-weight:800;font-size:18px;padding:6px 14px;border-radius:12px;background:var(--ink);color:var(--bg);min-width:62px;text-align:center}
.phases{display:none}
.phase{font-size:12px;padding:6px 12px;border-radius:999px;box-shadow:none;border-color:var(--line);background:var(--surface);color:var(--muted)}
.phase:hover{box-shadow:none;transform:none;border-color:var(--ink)}
.phase[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phase.open[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--accent-ink)}
.phase.closed[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:#fff}
.clock{display:flex;align-items:center;gap:8px;margin-left:auto}
.ring{width:46px;height:46px;flex:none}
.ring .bgc{stroke:var(--sunk)} .ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
.ring.low .fgc{stroke:var(--down)}
.clock .t{font-family:var(--f-mono);font-size:22px;font-weight:700;min-width:62px}
.clock .t.low{color:var(--down)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tab{border:var(--bw) solid transparent;border-bottom:none;border-radius:12px 12px 0 0;box-shadow:none;background:transparent;color:var(--muted);padding:9px 14px;white-space:nowrap}
.tab:hover{transform:none;box-shadow:none;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--ink);color:var(--ink);margin-bottom:-2px;padding-bottom:11px}
section.desk{padding-top:22px}

/* round guide */
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;padding:10px 12px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--surface);box-shadow:3px 3px 0 var(--shadow)}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px 5px 5px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface);color:var(--muted);box-shadow:none}
.step:hover{transform:none;box-shadow:none;border-color:var(--ink)}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:11px}
.step.done{color:var(--ink)} .step.done .n{background:var(--ink);color:var(--bg)}
.step[aria-current="step"]{border-color:var(--ink);color:var(--ink);background:var(--accent-soft)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.open[aria-current="step"]{background:var(--up-soft)} .step.open[aria-current="step"] .n{background:var(--up);color:#fff}
.step.closed[aria-current="step"]{background:var(--down-soft)} .step.closed[aria-current="step"] .n{background:var(--down);color:#fff}
.steps .sep{width:10px;height:2px;background:var(--line)}
.todo{flex:1 1 280px;min-width:0;font-size:14px;line-height:1.35}
.todo b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.next{font-size:15px;padding:10px 16px;white-space:nowrap}
/* tags & pills */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--up-soft);color:var(--up)} .pill.no{background:var(--down-soft);color:var(--down)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* market */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:stretch;margin-bottom:18px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-main{display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero h1{font-size:clamp(32px,5.4vw,68px);font-weight:800;line-height:.95;text-transform:uppercase}
.newsbox{font-size:clamp(17px,1.8vw,22px);line-height:1.35;background:var(--pop);color:#121429;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 16px;box-shadow:4px 4px 0 var(--shadow);max-width:70ch;font-weight:500}
.statebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:220px}
.bigring{width:150px;height:150px;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .bgc{stroke:var(--sunk)} .bigring .fgc{stroke:var(--accent);transition:stroke-dashoffset .25s linear}
.bigring.low .fgc{stroke:var(--down)}
.bigring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:34px;font-weight:700}
.flag{font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:var(--bw) solid var(--ink)}
.flag.open{background:var(--up);color:#fff}.flag.closed{background:var(--down);color:#fff}.flag.idle{background:var(--surface)}
.tickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}
.ticker{position:relative;overflow:hidden;padding:0;display:flex;flex-direction:column}
.ticker-top{height:10px;background:var(--c)}
.ticker-body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px}
.ticker .sym{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ticker .sym b{font-family:var(--f-mono);font-size:13px;padding:2px 8px;border-radius:8px;background:var(--c);color:#fff}
.ticker .nm{font-family:var(--f-display);font-size:16px;font-weight:700}
.ticker .px{font-family:var(--f-mono);font-size:clamp(34px,3.8vw,48px);font-weight:700;line-height:1}
.chg{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-weight:700;font-size:14px;padding:3px 9px;border-radius:999px;align-self:flex-start}
.chg.u{background:var(--up-soft);color:var(--up)} .chg.d{background:var(--down-soft);color:var(--down)} .chg.z{background:var(--sunk);color:var(--muted)}
.ticker svg{width:100%;height:46px;display:block}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.chart .mono{font-family:var(--f-mono)}
.chart .ink{fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink);stroke-width:1.5}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.chart .now{fill:var(--accent);fill-opacity:.08}
.chartwrap{overflow-x:auto}
.heat{display:grid;gap:4px;font-size:12px;min-width:520px}
.heat .h{font-weight:700;color:var(--muted);text-align:center;font-size:11px;padding:4px 0}
.heat .rn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.heat .cell{border-radius:8px;padding:8px 2px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:12px;color:var(--ink)}
.heat .cell.cur{outline:2px solid var(--ink);outline-offset:-2px}
.heat .cell.fut{background:var(--sunk);color:var(--muted);opacity:.5}

/* broker */
.desk-cols{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.desk-cols{grid-template-columns:1fr}}
.ticket{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.ticket input,.ticket select{width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;font-size:15px}
.seg button[aria-pressed="true"].buy{background:var(--up);color:#fff}
.seg button[aria-pressed="true"].sell{background:var(--down);color:#fff}
.assetpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.assetpick button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;box-shadow:none;border-color:var(--line)}
.assetpick button i{width:100%;height:5px;border-radius:3px;background:var(--c)}
.assetpick button small{font-family:var(--f-mono);font-weight:700;font-size:14px}
.assetpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk);box-shadow:2px 2px 0 var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.preview{background:var(--sunk);border-radius:12px;padding:12px;font-size:14px;display:grid;gap:6px}
.preview .line{display:flex;justify-content:space-between;gap:10px}
.capbar{position:relative;height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.capbar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.capbar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.verdict{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;border:var(--bw) solid currentColor}
.verdict.ok{background:var(--up-soft);color:var(--up)} .verdict.no{background:var(--down-soft);color:var(--down)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.teamchip{text-align:left;display:grid;gap:6px;box-shadow:none;border-color:var(--line);padding:10px 12px}
.teamchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--shadow);background:var(--accent-soft)}
.teamchip b{font-size:14px}
.teamchip .num{font-size:12px;color:var(--muted);font-weight:500}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--sunk)}
.stackbar i{display:block;height:100%}
details.key{border:var(--bw) dashed var(--line);border-radius:var(--r);padding:12px 16px;background:var(--surface)}
details.key summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}

/* wallet */
.wallet{display:grid;gap:14px}
.wallet-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 18px}
.wbig{font-family:var(--f-mono);font-weight:700;font-size:clamp(30px,3.4vw,42px);line-height:1}
.wmid{font-family:var(--f-mono);font-weight:700;font-size:20px}
.flow{display:grid;grid-template-columns:minmax(0,auto) minmax(60px,1fr) auto;gap:7px 12px;align-items:center;font-size:13px}
.flow .fl{font-weight:500}
.flow .fl b{display:inline-block;width:14px;font-family:var(--f-mono)}
.flow .bar{height:14px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden}
.flow .bar i{position:absolute;top:0;bottom:0;border-radius:7px}
.flow .fv{font-family:var(--f-mono);font-weight:700;text-align:right;white-space:nowrap}
.flow .total{border-top:var(--bw) solid var(--ink);padding-top:7px}
.flow.compact{font-size:12px}.flow.compact .bar{height:10px}
.stripe-out{background:repeating-linear-gradient(135deg,var(--down) 0 6px,color-mix(in oklab,var(--down) 55%,var(--surface)) 6px 12px)}
.stripe-in{background:repeating-linear-gradient(135deg,var(--up) 0 6px,color-mix(in oklab,var(--up) 55%,var(--surface)) 6px 12px)}
.cashmove{background:var(--sunk);border-radius:14px;padding:14px;display:grid;gap:10px}
.cm-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.cm-row .big{font-family:var(--f-mono);font-weight:700;font-size:24px;line-height:1.1}
.cm-arrow{font-size:22px;font-weight:700;color:var(--muted)}
.gauge{position:relative;height:22px;border-radius:11px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex}
.gauge i{display:block;height:100%}
.gauge-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.gauge-legend span{display:inline-flex;align-items:center;gap:6px}
.poss td,.poss th{padding:6px 8px}
/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.team-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--sunk);border-radius:12px;padding:8px 10px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:16px;font-weight:700}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.rank-n{font-family:var(--f-display);font-weight:800;font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:none}
.rank-n.g1{background:var(--pop);color:#121429}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:640px;margin:0 auto 4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pod .blk{width:100%;border:var(--bw) solid var(--ink);border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;box-shadow:4px 4px 0 var(--shadow)}
.pod b{font-family:var(--f-display);font-size:14px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--down-soft);color:var(--down);padding:10px 14px;border-radius:12px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);box-shadow:4px 4px 0 var(--accent)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;max-width:260px;box-shadow:3px 3px 0 var(--accent)}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}

/* ---------- Ledger ---------- */
function ledger(teamId,upto){
  const L={cash:CAPITAL,h:{},cost:{},fees:0,n:0,bought:0,sold:0,realized:0};ASSETS.forEach(a=>{L.h[a.k]=0;L.cost[a.k]=0});
  for(const t of S.trades){
    if(t.team!==teamId||t.status!=="ejecutado"||t.round>upto)continue;
    if(t.side==="BUY"){L.cash-=t.qty*t.price+t.fee;L.cost[t.asset]+=t.qty*t.price;L.h[t.asset]+=t.qty;L.bought+=t.qty*t.price}
    else{const avg=L.h[t.asset]?L.cost[t.asset]/L.h[t.asset]:0;L.cash+=t.qty*t.price-t.fee;L.sold+=t.qty*t.price;L.realized+=(t.price-avg)*t.qty;L.cost[t.asset]-=avg*t.qty;L.h[t.asset]-=t.qty}
    L.fees+=t.fee;L.n++}
  return L}
const holdVal=(L,r)=>ASSETS.reduce((s,a)=>s+L.h[a.k]*price(a.k,r),0);
const worth=(L,r)=>L.cash+holdVal(L,r);
const endWorth=(id,r)=>worth(ledger(id,Math.min(r,6)),r);
function finalWorth(id){const L=ledger(id,6);return Math.round(L.cash*(1-S.settings.inflation/100)+holdVal(L,6))}
function ddCrash(id){const L3=ledger(id,3);return pct(worth(L3,4),worth(L3,3))}

function emptyL(){const L={cash:CAPITAL,h:{},cost:{}};ASSETS.forEach(a=>{L.h[a.k]=0;L.cost[a.k]=0});return L}
function applyTrade(L,t){if(t.side==="BUY"){L.cash-=t.qty*t.price+t.fee;L.cost[t.asset]+=t.qty*t.price;L.h[t.asset]+=t.qty}
  else{const avg=L.h[t.asset]?L.cost[t.asset]/L.h[t.asset]:0;L.cash+=t.qty*t.price-t.fee;L.cost[t.asset]-=avg*t.qty;L.h[t.asset]-=t.qty}}
function teamDoc(id){const L=ledger(id,6);return {cash:L.cash,h:L.h,cost:L.cost}}
function check(o){
  const r=S.round;
  if(!tradable(r))return {ok:false,why:"La ronda de 5 años no se negocia."};
  if(!o.team)return {ok:false,why:"Elige el equipo."};
  if(!o.asset)return {ok:false,why:"Elige el activo."};
  if(!Number.isInteger(o.qty)||o.qty<=0)return {ok:false,why:"La cantidad debe ser un número entero mayor que cero."};
  return validate(ledger(o.team,r),o,r,S.settings)}
function validate(L,o,r,st){
  const p=price(o.asset,r),fee=st.fee,gross=o.qty*p;
  if(o.side==="BUY"){
    if(L.cash<gross+fee)return {ok:false,why:`Efectivo insuficiente: necesita $${fmt(gross+fee)} y tiene $${fmt(L.cash)}.`};
    const after=worth(L,r)-fee,pos=(L.h[o.asset]+o.qty)*p,pc=pos/after*100;
    if(pc>st.cap+1e-9)return {ok:false,why:`${an(o.asset)} quedaría en ${pc.toFixed(0)}% del patrimonio. El límite es ${st.cap}%.`,pct:pc};
    return {ok:true,cashAfter:L.cash-gross-fee,pct:pc}}
  if(L.h[o.asset]<o.qty)return {ok:false,why:`Solo tiene ${L.h[o.asset]} unidades de ${an(o.asset)}.`};
  if(L.cash+gross-fee<0)return {ok:false,why:"No alcanza para pagar la comisión."};
  const avg=L.h[o.asset]?L.cost[o.asset]/L.h[o.asset]:0;
  return {ok:true,cashAfter:L.cash+gross-fee,pnl:(p-avg)*o.qty}}

function niceTicks(min,max,n){const span=max-min||1,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||10*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t}

/* ---------- Chart: multi-line over rounds ---------- */
function lineChart({series,upto,nCols,w=760,h=300,yfmt=v=>v,tipFn,events=true,highlight=null,band=null,R=104}){
  const L=46,T=14,B=events?52:30,iw=w-L-R,ih=h-T-B;
  const vis=[];series.forEach(s=>s.vals.slice(0,upto+1).forEach(v=>vis.push(v)));
  if(band)vis.push(band);
  let mn=Math.min(...vis),mx=Math.max(...vis);if(mx-mn<10){mn-=5;mx+=5}
  const logS=mn>0&&mx/mn>40;
  let ticks,y0,y1,Y;const X=i=>L+(nCols===1?iw/2:i*iw/(nCols-1));
  if(logS){const a=Math.floor(Math.log10(mn)),b2=Math.ceil(Math.log10(mx));ticks=[];for(let e=a;e<=b2;e++)ticks.push(Math.pow(10,e));y0=a;y1=b2;Y=v=>T+ih-(Math.log10(Math.max(v,1e-9))-y0)/(y1-y0||1)*ih}
  else{ticks=niceTicks(mn,mx,4);y0=ticks[0];y1=ticks[ticks.length-1];Y=v=>T+ih-(v-y0)/(y1-y0)*ih}
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  const colW=iw/(nCols-1||1);
  if(logS)g+=`<text x="${L}" y="${T-2}" style="font-size:10.5px;font-weight:700">Escala logarítmica: cada línea es ×10</text>`;
  g+=`<rect class="now" x="${X(upto)-colW/2}" y="${T}" width="${colW}" height="${ih}" rx="8"/>`;
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${Y(t)}" y2="${Y(t)}"/><text class="mono" x="${L-8}" y="${Y(t)+4}" text-anchor="end">${yfmt(t)}</text>`});
  if(band){g+=`<line x1="${L}" x2="${L+iw}" y1="${Y(band)}" y2="${Y(band)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="0" opacity=".55"/><text x="${L+6}" y="${Y(band)-6}" class="ink" style="font-size:11px;font-weight:700">Inicio</text>`}
  for(let i=0;i<nCols;i++){g+=`<text x="${X(i)}" y="${T+ih+18}" text-anchor="middle" class="${i===upto?"ink":""}" style="font-weight:${i===upto?700:500}">R${i}</text>`;
    if(events)g+=`<text x="${X(i)}" y="${T+ih+34}" text-anchor="middle" style="font-size:10.5px">${ROUNDS[i].tag}</text>`}
  const ordered=highlight?[...series].sort((a,b)=>(a.id===highlight)-(b.id===highlight)):series;
  const ends=[];
  ordered.forEach(s=>{
    const v=s.vals.slice(0,upto+1);const dim=highlight&&s.id!==highlight;
    const col=dim?"var(--cash)":s.color;
    if(v.length>1){const pts=v.map((x,i)=>X(i).toFixed(1)+","+Y(x).toFixed(1)).join(" ");
      if(!dim&&series.length===1)g+=`<polygon points="${X(0)},${T+ih} ${pts} ${X(v.length-1)},${T+ih}" fill="${col}" fill-opacity=".1"/>`;
      g+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${dim?2:3}" stroke-linejoin="round" stroke-linecap="round" ${dim?'opacity=".7"':""}/>`}
    const lx=X(v.length-1),ly=Y(v[v.length-1]);
    g+=`<circle cx="${lx}" cy="${ly}" r="5.5" fill="${col}" stroke="var(--surface)" stroke-width="2.5"/>`;
    if(!dim)ends.push({y:ly,x:lx,label:s.short||s.name,val:s.vals[v.length-1]});
  });
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;
  ends.forEach(e=>{g+=`<text x="${L+iw+10}" y="${e.y+4}" class="ink" style="font-weight:700;font-size:12px">${esc(e.label)} <tspan class="mono" style="fill:var(--muted);font-weight:500">${yfmt(e.val)}</tspan></text>`});
  for(let i=0;i<=upto;i++){g+=`<rect class="hit" x="${X(i)-colW/2}" y="${T}" width="${colW}" height="${ih}" rx="8" ${tipAttr(tipFn(i))}/>`}
  return g+`</svg>`}

/* ---------- Chart: diverging horizontal bars ---------- */
function divergingBars(items,{w=520,rowH=40,fmtv=pctLabel}={}){
  const L=118,R=78,iw=w-L-R,h=items.length*rowH+24;
  const m=Math.min(100,Math.max(5,...items.map(i=>Math.abs(i.v))));const lim=Math.ceil(m/5)*5;
  const X=v=>L+iw/2+v/lim*iw/2;
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  [-lim,-lim/2,0,lim/2,lim].forEach(t=>{g+=`<line class="${t===0?"base":"grid"}" x1="${X(t)}" x2="${X(t)}" y1="4" y2="${h-20}"/><text class="mono" x="${X(t)}" y="${h-4}" text-anchor="middle">${t>0?"+":""}${t}%</text>`});
  items.forEach((it,i)=>{const y=6+i*rowH,bh=Math.min(24,rowH-12),x0=X(0),x1=X(Math.max(-lim,Math.min(lim,it.v))),bx=Math.min(x0,x1),bw=Math.max(2,Math.abs(x1-x0));
    g+=`<text x="${L-12}" y="${y+bh/2+4}" text-anchor="end" class="ink" style="font-weight:700">${esc(it.name)}</text>`;
    g+=`<rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${it.color}" ${tipAttr(`<b>${esc(it.name)}</b><br>${fmtv(it.v)}${it.extra?"<br>"+it.extra:""}`)}/>`;
    g+=`<text class="mono ink" x="${w-4}" y="${y+bh/2+4}" text-anchor="end" style="font-weight:700">${fmtv(it.v)}</text>`});
  return g+`</svg>`}

/* ---------- Chart: stacked columns per round ---------- */
function stackColumns(cols,{w=340,h=170,yMax}){
  const L=34,R=6,T=10,B=22,iw=w-L-R,ih=h-T-B,n=cols.length;
  const mx=yMax||Math.max(...cols.map(c=>c.total),1);const ticks=niceTicks(0,mx,3);const top=ticks[ticks.length-1];
  const Y=v=>T+ih-v/top*ih,band=iw/Math.max(n,7),bw=Math.min(26,band*.62);
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${Y(t)}" y2="${Y(t)}"/><text class="mono" x="${L-5}" y="${Y(t)+4}" text-anchor="end" style="font-size:10px">${kfmt(t)}</text>`});
  const cy=Y(CAPITAL);g+=`<line x1="${L}" x2="${L+iw}" y1="${cy}" y2="${cy}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>`;
  cols.forEach((c,i)=>{const cx=L+band*i+band/2;let acc=0;
    c.segs.forEach((s,j)=>{if(s.v<=0)return;const y=Y(acc+s.v),hh=Y(acc)-Y(acc+s.v);const isTop=j===c.segs.map((q,qi)=>q.v>0?qi:-1).reduce((a,b)=>Math.max(a,b));
      g+=`<rect x="${cx-bw/2}" y="${y+1}" width="${bw}" height="${Math.max(0,hh-2)}" ${isTop?'rx="4"':'rx="1"'} fill="${s.c}"/>`;acc+=s.v});
    g+=`<rect class="hit" x="${cx-band/2}" y="${T}" width="${band}" height="${ih}" rx="6" ${tipAttr(c.tip)}/>`;
    g+=`<text x="${cx}" y="${h-6}" text-anchor="middle" style="font-size:10.5px;font-weight:${c.cur?700:500}" class="${c.cur?"ink":""}">R${c.r}</text>`});
  return g+`</svg>`}

/* ---------- Chart: donut ---------- */
function donut(segs,{size=120,label,sub}){
  const r=size/2-10,C=2*Math.PI*r,tot=segs.reduce((s,x)=>s+x.v,0)||1;let off=0;
  let g=`<svg class="chart" viewBox="0 0 ${size} ${size}" role="img"><g transform="rotate(-90 ${size/2} ${size/2})">`;
  g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="16"/>`;
  segs.forEach(s=>{if(s.v<=0)return;const len=s.v/tot*C,gap=segs.filter(x=>x.v>0).length>1?2:0;
    g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" ${tipAttr(`<b>${esc(s.n)}</b><br>$${fmt(s.v)} · ${(s.v/tot*100).toFixed(0)}%`)}/>`;off+=len});
  g+=`</g><text x="${size/2}" y="${size/2+2}" text-anchor="middle" class="mono ink" style="font-size:15px;font-weight:700">${label}</text><text x="${size/2}" y="${size/2+18}" text-anchor="middle" style="font-size:10px">${sub}</text></svg>`;return g}

/* ---------- Chart: horizontal bars (ranking / scores) ---------- */
function hBars(rows,{w=620,rowH=38,max,fmtv=v=>"$"+fmt(v),ref}){
  const L=150,R=86,iw=w-L-R,h=rows.length*rowH+8;const mx=max||Math.max(...rows.map(r=>r.total),1);
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  if(ref){const rx=L+ref/mx*iw;g+=`<line x1="${rx}" x2="${rx}" y1="0" y2="${h}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>`}
  rows.forEach((r,i)=>{const y=4+i*rowH,bh=Math.min(24,rowH-12);let x=L;
    g+=`<text x="${L-12}" y="${y+bh/2+4}" text-anchor="end" class="ink" style="font-weight:700">${esc(r.name)}</text>`;
    const segs=r.segs.filter(s=>s.v>0);
    segs.forEach((s,j)=>{const ww=s.v/mx*iw;g+=`<rect x="${x}" y="${y}" width="${Math.max(0,ww-(j<segs.length-1?2:0))}" height="${bh}" rx="${j===segs.length-1?5:1}" fill="${s.c}" ${tipAttr(`<b>${esc(r.name)}</b><br>${esc(s.n)}: ${s.label||s.v}`)}/>`;x+=ww});
    g+=`<text class="mono ink" x="${x+8}" y="${y+bh/2+4}" style="font-weight:700">${fmtv(r.total)}</text>`});
  return g+`</svg>`}

/* ---------- Clock (shared through phaseEndsAt) ---------- */
let clockIv=null;
function ensureClock(){if(S.phaseEndsAt&&S.phaseEndsAt>nowS()&&!clockIv)clockIv=setInterval(tick,200)}
function startClock(sec,phase){S.phaseDur=sec;S.phaseEndsAt=nowS()+sec*1000;if(phase)S.phase=phase;save();render();ensureClock();tick()}
function stopClock(){S.phaseEndsAt=0;clearInterval(clockIv);clockIv=null;save();tick()}
function tick(){
  const end=S.phaseEndsAt||0,durS=S.phaseDur||0,leftMs=Math.max(0,end-nowS()),running=end>0&&leftMs>0,left=Math.ceil(leftMs/1000);
  const txt=Math.floor(left/60)+":"+String(left%60).padStart(2,"0"),low=running&&left<=(durS>=120?30:10),frac=running&&durS?leftMs/(durS*1000):0;
  document.querySelectorAll("[data-clock]").forEach(e=>e.textContent=txt);
  const ct=$("#clockT");if(ct){ct.textContent=txt;ct.classList.toggle("low",low)}
  const mr=$("#miniRing");if(mr){mr.classList.toggle("low",low);mr.querySelector(".fgc").setAttribute("stroke-dashoffset",(119.4*(1-frac)).toFixed(1))}
  document.querySelectorAll(".bigring").forEach(br=>{br.classList.toggle("low",low);br.querySelector(".fgc").setAttribute("stroke-dashoffset",(408.4*(1-frac)).toFixed(1))});
  if(end>0&&leftMs===0){clearInterval(clockIv);clockIv=null;
    if(MODE!=="team"){S.phaseEndsAt=0;if(S.phase==="abierto"){S.phase="cerrado";save();render();toast("Mercado cerrado. Ahora registra los tickets del buzón.")}else{save();if(S.phase==="analisis")toast("Terminó el análisis. Abre el mercado.")}}}
  else if(!running&&clockIv){clearInterval(clockIv);clockIv=null}
}

/* ---------- Mercado ---------- */
function priceTip(i){return `<b>Ronda ${i} · ${ROUNDS[i].tag}</b>`+ASSETS.map(a=>`<div class='r'><span>${swatch(a.c)}${a.n}</span><b>$${fmt(price(a.k,i))}</b></div>`).join("")}
function renderMercado(){

function tickersHTML(r){const nCols=maxRound()+1;
  return ASSETS.map(a=>{const p=price(a.k,r),prev=r?price(a.k,r-1):p,ch=pct(p,prev);
    const v=PRICES[a.k].slice(0,r+1),mn=Math.min(...PRICES[a.k].slice(0,nCols)),mx=Math.max(...PRICES[a.k].slice(0,nCols));

    return `<div class="card ticker" style="--c:${a.c}"><div class="ticker-top"></div><div class="ticker-body">
      <div class="sym"><b>$${a.sym}</b><span class="lbl">Riesgo ${a.risk}</span></div>
      <div class="nm">${a.n}</div><div class="px" style="${p>=10000?"font-size:clamp(26px,2.6vw,36px)":""}">$${fmt(p)}</div>
      <span class="chg ${r?chgCls(ch):"z"}">${r?arrow(ch)+" "+pctLabel(ch):"Precio inicial"}</span>${sp}
      <div class="muted num" style="font-size:12px">Desde el inicio ${pctLabel(pct(p,PRICES[a.k][0]))}</div></div></div>`}).join("")}
function renderMercado2(r,R,nCols,tickers,moves){
  const line=lineChart({series:ASSETS.map(a=>({id:a.k,name:a.n,short:a.sym,color:a.c,vals:PRICES[a.k].slice(0,nCols)})),upto:r,nCols,yfmt:v=>"$"+kfmt(v),tipFn:priceTip});
  // heatmap
  let heat=`<div class="heat" style="grid-template-columns:130px repeat(${nCols-1},minmax(0,1fr))"><div></div>`;
  for(let i=1;i<nCols;i++)heat+=`<div class="h">R${i}<br><span style="font-weight:500">${ROUNDS[i].tag}</span></div>`;
  ASSETS.forEach(a=>{heat+=`<div class="rn">${swatch(a.c)}${a.n}</div>`;
    for(let i=1;i<nCols;i++){const ch=pct(price(a.k,i),price(a.k,i-1));
      if(i>r){heat+=`<div class="cell fut">?</div>`;continue}
      const mag=Math.min(1,Math.abs(ch)/40),col=ch>=0?"var(--up)":"var(--down)";
      heat+=`<div class="cell ${i===r?"cur":""}" style="background:color-mix(in oklab, ${col} ${Math.round(12+mag*70)}%, var(--surface));${mag>.55?"color:#fff":""}" ${tipAttr(`<b>${a.n} · R${i}</b><br>$${fmt(price(a.k,i-1))} → $${fmt(price(a.k,i))}<br>${sign(ch)}`)} tabindex="0">${pctLabel(ch)}</div>`}});
  heat+=`</div>`;
  let rank="";
  if(!S.hideRank){const rows=S.teams.map(t=>{const L=ledger(t.id,Math.min(r,6)),rr=r;return {name:t.name,total:worth(L,rr),segs:[...ASSETS.map(a=>({n:a.n,c:a.c,v:L.h[a.k]*price(a.k,rr),label:"$"+fmt(L.h[a.k]*price(a.k,rr))})),{n:"Efectivo",c:"var(--cash)",v:Math.max(0,L.cash),label:"$"+fmt(L.cash)}]}}).sort((a,b)=>b.total-a.total);
    rank=`<div class="card" style="margin-top:18px"><div class="card-h"><h2>Carrera de patrimonio · R${r}</h2><div class="legend">${ASSETS.map(a=>`<span>${swatch(a.c)}${a.n}</span>`).join("")}<span>${swatch("var(--cash)")}Efectivo</span><span><i class="sw" style="background:var(--ink);width:2px;height:12px"></i>Capital inicial</span></div></div><div class="chartwrap">${hBars(rows,{w:760,ref:CAPITAL,max:Math.max(...rows.map(x=>x.total),CAPITAL)*1.05})}</div></div>`}
  $("#desk-mercado").innerHTML=`
   <div class="hero"><div class="hero-main"><div class="lbl">Ronda ${r}${r===7?" · bonus":""} de ${maxRound()}</div><h1>${R.t}</h1><div class="newsbox">${esc(R.news)}</div></div>

   <div class="cols-2">

     <div class="card"><div class="card-h"><h2>Mapa de calor</h2><p>Verde sube, rojo baja; más intenso, más fuerte</p></div><div class="chartwrap">${heat}</div></div>
   </div>

function compSegs(L,r){return [...ASSETS.map(a=>({n:a.n,c:a.c,v:L.h[a.k]*price(a.k,r)})),{n:"Efectivo",c:"var(--cash)",v:Math.max(0,L.cash)}]}

function flowHTML(L,{compact=false}={}){
  const top=CAPITAL+L.sold||1,pc=v=>(v/top*100).toFixed(2)+"%";

    ${row("","Capital inicial",0,CAPITAL,"var(--ink)","$"+fmt(CAPITAL))}

  if(!rows)return `<div class="muted" style="font-size:13px">Todavía no tiene activos: todo su dinero está en efectivo.</div>`;

    <tr><td><b>Total</b></td><td></td><td class="r num"><b>$${fmt(tc)}</b></td><td class="r num"><b>$${fmt(tv)}</b></td><td class="r num ${tr>=0.5?"up":tr<=-0.5?"down":""}"><b>${tr>=0.5?"+":tr<=-0.5?"−":""}$${fmt(Math.abs(tr))}</b></td></tr></tbody></table></div>`}

  let held="";

let busy=false,lastOk=null;
async function executeTicket(status,why){
  if(busy)return;
  if(MODE==="team"&&!FB){toast("Sin conexión con el mercado. Esperen unos segundos: se reconecta solo.");return}
  if(FB){
    const o={team:T.team,side:T.side,asset:T.asset,qty:Number(T.qty),rm:T.rm,reason:T.reason.trim()};busy=true;render();
    try{const t=await executeRemote(o,status,why,MODE==="team"?"equipo":"broker");
      if(t&&!S.trades.some(x=>x.id===t.id)){S.trades.push(t);S.trades.sort((a,b)=>a.id-b.id)}
      lastOk=status==="ejecutado"?{team:t.team,text:`✓ Orden ejecutada: ${t.side==="BUY"?"compraron":"vendieron"} ${t.qty} ${an(t.asset)} a $${fmt(t.price)}. Efectivo disponible ahora: $${fmt(ledger(t.team,Math.min(S.round,6)).cash)}.`}:null;

      T={team:T.team,side:T.side,asset:null,qty:"",reason:"",rm:false}}
    catch(e){toast("No se ejecutó: "+(e&&e.message||"error de conexión"))}
    busy=false;render();return}
  const r=S.round,p=price(T.asset,r);S.seq++;while(S.trades.some(t=>t.id===S.seq))S.seq++;
  S.trades.push({id:S.seq,team:T.team,round:r,side:T.side,asset:T.asset,qty:Number(T.qty),price:p,fee:status==="ejecutado"?S.settings.fee:0,reason:T.reason.trim(),rm:T.rm,status,why:why||"",ts:Date.now()});save();
  lastOk=status==="ejecutado"?{team:T.team,text:`✓ Orden ejecutada: ${tn(T.team)} ${T.side==="BUY"?"compró":"vendió"} ${T.qty} ${an(T.asset)} a $${fmt(p)}. Efectivo disponible ahora: $${fmt(ledger(T.team,Math.min(r,6)).cash)}.`}:null;
  toast(status==="ejecutado"?`✓ ${tn(T.team)} ${T.side==="BUY"?"compra":"vende"} ${T.qty} ${an(T.asset)} a $${fmt(p)}`:`Rechazo registrado: ${why}`);
  T={team:T.team,side:T.side,asset:null,qty:"",reason:"",rm:false};render()}

function scores(){
  const final=S.round>=6;
  const rows=S.teams.map(t=>{const r=Math.min(S.round,6),L=ledger(t.id,r);const fw=final?finalWorth(t.id):Math.round(worth(L,r));
    const tot=worth(L,r),wts=ASSETS.map(a=>L.h[a.k]*price(a.k,r)/tot);const nA=wts.filter(x=>x>=.1).length,maxW=Math.max(...wts)*100;
    const div=nA<=1?2:nA===2?8:(nA>=4&&maxW<=40)?20:14;let risk=null,dd=null;
    if(S.round>=4){dd=ddCrash(t.id);const a=Math.abs(Math.min(0,dd));risk=a<10?20:a<20?14:a<30?8:2}
    return {t,fw,nA,maxW,div,dd,risk,dec:S.decision[t.id]||0}});
  const sorted=[...rows].sort((a,b)=>b.fw-a.fw);sorted.forEach((x,i)=>{x.rank=i+1;x.rent=Math.max(4,40-6*i)});
  for(let i=1;i<sorted.length;i++)if(sorted[i].fw===sorted[i-1].fw){sorted[i].rent=sorted[i-1].rent;sorted[i].rank=sorted[i-1].rank}
  rows.forEach(x=>x.total=x.rent+x.div+(x.risk||0)+x.dec);return {rows:rows.sort((a,b)=>b.total-a.total),final}}
function observe(id){const ex=S.trades.filter(t=>t.team===id&&t.status==="ejecutado");
  const k2=ex.filter(t=>t.round===2&&t.side==="BUY"&&t.asset==="K").reduce((s,t)=>s+t.qty,0);
  let loss4=0;const L3=ledger(id,3);ex.filter(t=>t.round===4&&t.side==="SELL").forEach(t=>{const avg=L3.h[t.asset]?L3.cost[t.asset]/L3.h[t.asset]:0;if(t.price<avg)loss4+=(avg-t.price)*t.qty});
  const buy4=ex.filter(t=>t.round===4&&t.side==="BUY").map(t=>t.qty+" "+A(t.asset).sym).join(", ");
  return {k2,loss4:Math.round(loss4),buy4,cash3:S.round>=3?L3.cash/worth(L3,3)*100:null}}

  const names=["Contrarian","Fundamentos","Conservador","Diversificado","Apostador","FOMO + pánico"];S.teams.forEach((t,i)=>t.name=names[i]);

  const plan={t1:{0:[["S",4900,"Base segura"],["G",2400,"Contrato confirmado"],["N",2400,"IA con ventas"]],4:[["S",-0.5,"Liquidez para comprar en la caída"],["N",2500,"Kaiman reporta ventas +30%"]]},
   t2:{0:[["N",4900,"Ventas en crecimiento"],["G",4900,"Energía limpia con contratos"]]},t3:{0:[["S",4900,"Proteger capital"],["G",2400,"Riesgo medio"],["N",2400,"Crecimiento"]]},
   t4:{0:ASSETS.map(a=>[a.k,1900,"Un poco de todo"])},t5:{0:[["K",4900,"Puede explotar"],["O",4900,"Tengo un presentimiento"]]},
   t6:{0:ASSETS.map(a=>[a.k,1900,"Un poco de todo"]),2:[["S",-1,"Todos compran Krugs"],["K","cash","El influencer dice ×10"]],4:[["K",-1,"Hay que salir ya"],["O",-1,"Pánico"]]}};
  const fee=S.settings.fee;
  for(let r=0;r<=6;r++)for(const t of S.teams)(plan[t.id][r]||[]).forEach(([k,amt,why])=>{

  if(FB&&(NET==="on"||NET==="connecting"))return `<div class="card" style="grid-column:1/-1"><div class="card-h"><h2>Juego en línea</h2>${NET==="on"&&!STALE?`<span class="netpill on"><i></i>Conectado · ${esc(FB.gameId)}</span>`:`<span class="netpill err"><i></i>Reconectando · ${esc(FB.gameId)}</span>`}</div>
    <div style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start"><div class="qrbox" id="qrBox"></div>
    <div style="flex:1 1 360px;min-width:0;display:grid;gap:12px"><p style="margin:0">Cada equipo abre este enlace en su laptop o tablet, y elige su equipo en la lista. Sus órdenes se ejecutan solas cuando el mercado está abierto y cumplen las reglas.</p>
      <div class="linkbox" id="teamLinkBox">${esc(teamLink())}</div><div class="toolbar"><button id="copyLink" class="primary">Copiar enlace</button><button id="goLocal" class="ghost">Desconectar y volver a modo local</button></div>
</div></div></div>`;
  return `<div class="card" style="grid-column:1/-1"><div class="card-h"><h2>Juego en línea</h2><span class="netpill ${NET==="err"?"err":""}"><i></i>${NET==="connecting"?"Conectando…":NET==="err"?"Sin conexión":"Modo local"}</span></div>
    ${has?`<div style="display:grid;gap:12px;max-width:760px"><p style="margin:0">Pega la configuración web de tu proyecto de Firebase (Configuración del proyecto → Tus apps → SDK de Firebase). Se guarda solo en este navegador y viaja en el enlace de los equipos.</p>
      <label class="f"><span class="lbl">Configuración de Firebase</span><textarea id="fbCfg" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, appId: &quot;…&quot; };">${esc(JSON.stringify(saved?saved.cfg:DEFAULT_CFG,null,1))}</textarea></label>
      <div class="toolbar"><button id="createOnline" class="primary">Crear juego en línea con esta partida</button>${saved?`<button id="reconnect">Reconectar a ${esc(saved.gameId)}</button>`:""}</div>
      ${saved?`<div class="lbl" style="margin-top:6px">Enlace general de los equipos · ${esc(saved.gameId)}</div><div class="linkbox" id="teamLinkBox">${esc(teamLink())}</div><div class="toolbar"><button id="copyLink">Copiar enlace</button></div>`:""}
      ${NET==="err"&&lastErr?`<div class="verdict no">${esc(lastErr)}</div>`:""}<p class="muted" style="margin:0;font-size:13px">Al crear el juego se suben los equipos, las reglas y las órdenes actuales.</p></div>`
    :`<p class="muted" style="margin:0">El juego en línea funciona en la versión publicada en GitHub Pages. Esta vista trabaja en modo local.</p>`}</div>`}

/* ---------- Render + events ---------- */
function safeRender(){const a=document.activeElement;if(a&&a.matches&&a.matches("input,select,textarea")&&a.closest(".desk")){pendingRender=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingRender)setTimeout(()=>{if(!pendingRender)return;const a=document.activeElement;if(!(a&&a.matches&&a.matches("input,select,textarea")))render()},350)});
function render(){pendingRender=false;document.body.classList.toggle("teammode",MODE==="team");
  if(MODE==="team"){$("#logoSub").textContent="Pantalla del equipo";$("#roundBadge").textContent="R"+S.round;TABS.forEach(([k])=>$("#desk-"+k).hidden=true);$("#desk-team").hidden=false;renderTeam();tip.hidden=true;tick();return}
  $("#desk-team").hidden=true;renderStrip();({mercado:renderMercado,broker:renderBroker,equipos:renderEquipos,puntaje:renderPuntaje,registro:renderRegistro,ajustes:renderAjustes})[S.tab]();tip.hidden=true;tick()}
function goRound(d){const n=S.round+d;if(n<0||n>maxRound())return;S.round=n;S.phase="noticia";stopClock();T.asset=null;T.qty="";save();render()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;save();render();return}
  if(b.dataset.ph){const ph=b.dataset.ph;if(ph==="analisis")startClock(anaSec(),ph);else if(ph==="abierto")startClock(mktSec(),ph);else{stopClock();setPhase(ph)}return}
  if(b.id==="prevRound"){goRound(-1);return} if(b.id==="nextRound"){goRound(1);return}
  if(b.id==="tStop"){stopClock();return}
  if(b.dataset.go){S.tab=b.dataset.go;save();render();return}
  if(b.id==="nextStep"){
    if(S.phase==="noticia")startClock(anaSec(),"analisis");
    else if(S.phase==="analisis")startClock(mktSec(),"abierto");
    else if(S.phase==="abierto"){stopClock();setPhase("cerrado");toast("Mercado cerrado. Ahora registra los tickets del buzón.")}
    else if(S.round>=maxRound()){S.tab="puntaje";save();render()}
    else{goRound(1);if(S.round===7){S.tab="mercado";save();render()}}
    return}
  if(b.id==="toggleRank"){S.hideRank=!S.hideRank;save();render();return}
  if(b.id==="toggleQR"){S.showQR=!S.showQR;save();render();return}
  if(b.id==="createOnline"){try{const cfg=parseCfg($("#fbCfg").value);const id="KS-"+Math.random().toString(36).slice(2,8).toUpperCase();goOnline(cfg,id,true)}catch(e){toast(e.message)}return}
  if(b.id==="reconnect"){try{const sv=JSON.parse(localStorage.getItem(KEY_ONLINE));goOnline(sv.cfg,sv.gameId,false)}catch(e){toast("No hay un juego guardado.")}return}
  if(b.id==="goLocal"){goLocal();return}
  if(b.id==="joinGo"){const id=$("#joinTeam").value;if(!id){joinErr="Elijan su equipo en la lista.";render();return}joinErr="";joinTeam(id);return}
  if(b.id==="copyLink"||b.dataset.copyteam){const txt=teamLink(b.dataset.copyteam||"");navigator.clipboard.writeText(txt).then(()=>toast("Enlace copiado.")).catch(()=>{const lb=$("#teamLinkBox");if(lb){lb.textContent=txt;const rg=document.createRange();rg.selectNodeContents(lb);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}toast("Copia el enlace seleccionado.")});return}
  if(b.id==="reloadBtn"){location.reload();return}
  if(b.id==="leaveTeam"){T.team=null;try{localStorage.removeItem(KEY_TEAM)}catch(e){}render();return}
  if(b.dataset.focus){S.focusTeam=S.focusTeam===b.dataset.focus?null:b.dataset.focus;save();render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.team){T.team=b.dataset.team;render();return}
  if(b.dataset.side){T.side=b.dataset.side;render();return}
  if(b.dataset.asset){T.asset=b.dataset.asset;lastOk=null;render();return}
  if(b.id==="clearBtn"){T={team:T.team,side:"BUY",asset:null,qty:"",reason:"",rm:false};render();return}
  if(b.id==="rejectBtn"){const c=check({team:T.team,side:T.side,asset:T.asset,qty:Number(T.qty),rm:T.rm});executeTicket("rechazado",c.why);return}
  if(b.dataset.void){pendingVoid=Number(b.dataset.void);render();return}
  if(b.id==="voidYes"){S.trades=S.trades.filter(t=>t.id!==pendingVoid);toast("Orden #"+num(pendingVoid)+" anulada.");pendingVoid=null;save();render();return}
  if(b.id==="voidNo"){pendingVoid=null;render();return}
  if(b.id==="csvBtn"){saveFile("smart-market-registro.csv",csv());return}
  if(b.id==="jsonBtn"){saveFile("smart-market-respaldo.json",JSON.stringify(S,null,1));return}
  if(b.id==="addTeam"){const n=S.teams.length+1;let id="t"+n;while(S.teams.some(t=>t.id===id))id+="x";S.teams.push({id,name:"Equipo "+letter(n-1),pin:pin4()});save();render();return}
  if(b.id==="delTeam"){S.teams.pop();save();render();return}
  if(b.id==="demoBtn"){loadDemo();return}
  if(b.id==="resetBtn"){pendingReset=true;render();return} if(b.id==="resetNo"){pendingReset=false;render();return}
  if(b.id==="resetYes"){const keep=S.teams.map(t=>({name:t.name,pin:t.pin}));S=freshState(keep.length);S.teams.forEach((t,i)=>{t.name=keep[i].name;if(keep[i].pin)t.pin=keep[i].pin});pendingReset=false;stopClock();save();render();toast("Nueva partida lista en R0.");return}});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id!=="ticketForm")return;if(busy)return;const c=check({team:T.team,side:T.side,asset:T.asset,qty:Number(T.qty),rm:T.rm});if(c.ok)executeTicket("ejecutado")});
let reRender;
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="qty"){T.qty=el.value.trim();clearTimeout(reRender);reRender=setTimeout(()=>{const a=document.activeElement;if(a&&a.id!=="qty"&&a.matches&&a.matches("input,select,textarea")){pendingRender=true;return}const wasQ=a&&a.id==="qty";render();const q=$("#qty");if(q&&wasQ){q.focus();const v=q.value;q.value="";q.value=v}},300)}
  else if(el.id==="reason")T.reason=el.value;
  else if(el.dataset.tname){const t=S.teams.find(x=>x.id===el.dataset.tname);if(el.value.trim())t.name=el.value;save()}});
document.addEventListener("change",e=>{const el=e.target;
  if(el.id==="teamSel"){T.team=el.value||null;render()}
  else if(el.id==="rm"){T.rm=el.checked;render()}
  else if(el.dataset.dec){S.decision[el.dataset.dec]=Number(el.value);save();render()}
  else if(el.id==="sFee"){S.settings.fee=Math.max(0,Math.round(Number(el.value)||0));save()}
  else if(el.id==="sCap"){S.settings.cap=Math.min(100,Math.max(10,Number(el.value)||50));save()}
  else if(el.id==="sInf"){S.settings.inflation=Math.min(50,Math.max(0,Number(el.value)||0));save()}
  else if(el.id==="sAna"){S.settings.analysisSec=Math.min(600,Math.max(10,Math.round(Number(el.value)||60)));save();renderStrip()}
  else if(el.id==="sMkt"){S.settings.marketSec=Math.min(1200,Math.max(30,Math.round((Number(el.value)||5)*60)));save();renderStrip()}
  else if(el.id==="sOpen"){S.settings.alwaysOpen=el.checked;save();render()}
  else if(el.id==="sBonus"){S.settings.bonus=el.checked;if(!el.checked&&S.round>6)S.round=6;save();render()}
  else if(el.dataset.tname){render()}
  else if(el.id==="restore"&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.teams||!d.trades)throw 0;S=d;save();render();toast("Respaldo restaurado.")}catch(_){toast("Ese archivo no es un respaldo de Smart Market.")}};fr.readAsText(el.files[0])}});
document.addEventListener("keydown",e=>{if(MODE==="team"||e.target.matches("input,select,textarea"))return;if(e.key==="ArrowRight")goRound(1);if(e.key==="ArrowLeft")goRound(-1)});
if(MODE==="team"){try{const sv=JSON.parse(localStorage.getItem(KEY_TEAM)||"null");if(sv&&sv.game===QS.get("juego"))T.team=sv.team}catch(e){}
  render();try{goOnline(dec(QS.get("cfg")||""),QS.get("juego"),false)}catch(e){NET="err";render()}}
else{render();ensureClock();try{const sv=JSON.parse(localStorage.getItem(KEY_ONLINE)||"null");if(sv&&window.firebase)goOnline(sv.cfg,sv.gameId,false)}catch(e){}}
$("#verTag").textContent="v"+VERSION;
initDownloads();
})();
</script>
